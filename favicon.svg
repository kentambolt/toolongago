<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tlaFav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB37A"/>
      <stop offset="100%" stop-color="#F26B5E"/>
    </linearGradient>
  </defs>
  <!-- Navy background fills the full canvas so any circular crop (Android home screen, tab favicon, etc.) shows the brand color around the hourglass. Slight corner rounding for the browser-tab favicon case where no OS mask is applied. -->
  <rect width="32" height="32" rx="6" fill="#1B2238"/>
  <!--
    Hourglass shrunk well inside the maskable safe zone (corners ~10 from center; safe radius ~12.8).
    Neck is 3x2 so the pinch isn't a single point. Stroke rounds the corners.
  -->
  <path
    d="M 10 8 H 22 L 17.5 15 V 17 L 22 24 H 10 L 14.5 17 V 15 Z"
    fill="url(#tlaFav)"
    stroke="url(#tlaFav)"
    stroke-width="1.25"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
